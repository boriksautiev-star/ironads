<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Восстановление пароля - IronAds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dark-theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
        .card { background: white; border-radius: 1.5rem; padding: 2rem; max-width: 500px; width: 100%; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        h2 { margin-bottom: 1.5rem; color: #1f2937; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: #374151; }
        input, select { width: 100%; padding: 0.7rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-size: 0.9rem; }
        button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 0.7rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; width: 100%; }
        .back-link { display: inline-block; margin-top: 1rem; text-align: center; width: 100%; color: #667eea; text-decoration: none; }
        .error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; }
        .success { color: #10b981; font-size: 0.85rem; margin-top: 0.5rem; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔐 Восстановление пароля</h2>
    <div id="step1" class="step active">
        <div class="form-group">
            <label>Имя пользователя или Email</label>
            <input type="text" id="identifier" placeholder="Введите ваш username или email">
        </div>
        <button id="requestQuestionBtn">Далее</button>
        <div id="step1Error" class="error"></div>
    </div>
    <div id="step2" class="step">
        <div class="form-group">
            <label>Контрольный вопрос</label>
            <div id="securityQuestionDisplay" ></div>
        </div>
        <div class="form-group">
            <label>Ваш ответ</label>
            <input type="text" id="securityAnswerInput" placeholder="Введите ответ">
        </div>
        <div class="form-group">
            <label>Новый пароль</label>
            <input type="password" id="newPassword" placeholder="Минимум 6 символов">
        </div>
        <div class="form-group">
            <label>Подтверждение пароля</label>
            <input type="password" id="newPasswordConfirm" placeholder="Повторите пароль">
        </div>
        <button id="resetPasswordBtn">Сбросить пароль</button>
        <div id="step2Error" class="error"></div>
        <div id="step2Success" class="success"></div>
        <a href="/" class="back-link">← Вернуться на главную</a>
    </div>
</div>

<script>
    let resetToken = null;
    let userId = null;

    document.getElementById('requestQuestionBtn').addEventListener('click', async () => {
        const identifier = document.getElementById('identifier').value.trim();
        if (!identifier) {
            document.getElementById('step1Error').innerText = 'Введите имя пользователя или email';
            return;
        }
        document.getElementById('step1Error').innerText = '';
        try {
            const resp = await fetch('/api/auth/forgot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier })
            });
            const data = await resp.json();
            if (!resp.ok) {
                document.getElementById('step1Error').innerText = data.error || 'Ошибка';
                return;
            }
            resetToken = data.resetToken;
            userId = data.userId;
            document.getElementById('securityQuestionDisplay').innerText = data.security_question;
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        } catch (err) {
            document.getElementById('step1Error').innerText = 'Ошибка соединения';
        }
    });

    document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
        const answer = document.getElementById('securityAnswerInput').value.trim();
        const newPass = document.getElementById('newPassword').value;
        const newPassConfirm = document.getElementById('newPasswordConfirm').value;
        if (!answer || !newPass || !newPassConfirm) {
            document.getElementById('step2Error').innerText = 'Заполните все поля';
            return;
        }
        if (newPass.length < 6) {
            document.getElementById('step2Error').innerText = 'Пароль должен быть не менее 6 символов';
            return;
        }
        if (newPass !== newPassConfirm) {
            document.getElementById('step2Error').innerText = 'Пароли не совпадают';
            return;
        }
        document.getElementById('step2Error').innerText = '';
        try {
            const resp = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resetToken, security_answer: answer, newPassword: newPass })
            });
            const data = await resp.json();
            if (!resp.ok) {
                document.getElementById('step2Error').innerText = data.error || 'Ошибка';
                return;
            }
            document.getElementById('step2Success').innerText = data.message + ' Через 3 секунды вы будете перенаправлены на главную.';
            setTimeout(() => { window.location.href = '/'; }, 3000);
        } catch (err) {
            document.getElementById('step2Error').innerText = 'Ошибка соединения';
        }
    });
</script>
</body>
</html>
