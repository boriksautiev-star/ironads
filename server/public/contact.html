<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Связаться с администрацией - IronAds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dark-theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 28px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { font-size: 1.8rem; margin-bottom: 1rem; color: #1f2937; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
        input, textarea, select { width: 100%; padding: 0.7rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-size: 0.9rem; font-family: inherit; }
        .h-captcha { margin: 1rem 0; }
        button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 0.7rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; width: 100%; }
        .back-link { display: inline-block; margin-top: 1rem; text-align: center; width: 100%; color: #667eea; text-decoration: none; }
        .error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; }
        .success { color: #10b981; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }
        @media (max-width: 768px) { .container { padding: 1rem; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📧 Связаться с поддержкой</h1>
    <form id="contactForm">
        <div class="form-group">
            <label>Ваше имя (необязательно)</label>
            <input type="text" id="contactName" placeholder="Как к вам обращаться?">
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="contactEmail" required placeholder="ваш@email.com">
        </div>
        <div class="form-group">
            <label>Тема (необязательно)</label>
            <input type="text" id="contactSubject" placeholder="Например: Проблема с входом">
        </div>
        <div class="form-group">
            <label>Сообщение *</label>
            <textarea id="contactMessage" rows="5" required placeholder="Опишите вашу проблему или вопрос..."></textarea>
        </div>
        <div class="h-captcha" data-sitekey=""></div>
        <div id="contactError" class="error"></div>
        <div id="contactSuccess" class="success" style="display: none;"></div>
        <button type="submit">Отправить сообщение</button>
    </form>
    <a href="/" class="back-link">← Вернуться на главную</a>
</div>

<script src="https://js.hcaptcha.com/1/api.js?hl=ru" async defer></script>
<script>
    fetch('/api/public-settings')
        .then(res => res.json())
        .then(settings => {
            const enabled = settings.hcaptcha_enabled === 'true';
            const siteKey = settings.hcaptcha_site_key || '';
            if (enabled && siteKey) {
                document.querySelector('.h-captcha').setAttribute('data-sitekey', siteKey);
                if (typeof hcaptcha !== 'undefined') {
                    hcaptcha.render(document.querySelector('.h-captcha'), { sitekey: siteKey, hl: 'ru' });
                }
            } else {
                document.querySelector('.h-captcha').style.display = 'none';
            }
        })
        .catch(console.warn);

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('contactName').value.trim();
        const email = document.getElementById('contactEmail').value.trim();
        const subject = document.getElementById('contactSubject').value.trim();
        const message = document.getElementById('contactMessage').value.trim();
        if (!email || !message) {
            document.getElementById('contactError').innerText = 'Email и сообщение обязательны';
            return;
        }
        let hcaptchaToken = null;
        const captchaContainer = document.querySelector('.h-captcha');
        if (captchaContainer && captchaContainer.style.display !== 'none') {
            if (typeof hcaptcha !== 'undefined') {
                hcaptchaToken = hcaptcha.getResponse(captchaContainer);
            }
            if (!hcaptchaToken) {
                document.getElementById('contactError').innerText = 'Пожалуйста, подтвердите, что вы не робот';
                return;
            }
        }
        document.getElementById('contactError').innerText = '';
        try {
            const resp = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, subject, message, hcaptchaToken })
            });
            const data = await resp.json();
            if (resp.ok) {
                document.getElementById('contactSuccess').style.display = 'block';
                document.getElementById('contactSuccess').innerText = 'Сообщение отправлено! Администратор свяжется с вами в ближайшее время.';
                document.getElementById('contactForm').reset();
                if (captchaContainer && typeof hcaptcha !== 'undefined') hcaptcha.reset(captchaContainer);
            } else {
                document.getElementById('contactError').innerText = data.error || 'Ошибка отправки';
            }
        } catch (err) {
            document.getElementById('contactError').innerText = 'Ошибка соединения';
        }
    });
</script>
</body>
</html>
