<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое объявление - IronAds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/dark-theme.css">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=97d0fa92-e83f-48a4-b404-4a55881bc4a8&suggest_apikey=4b980638-31f9-47fb-9bd6-77fa0023a874&lang=ru_RU" defer></script>
    
    <style>
        body { background: #f4f6f9; margin-left: 260px; padding-top: 2rem; font-family: 'Inter', sans-serif; }
        .page-container { max-width: 800px; margin: 0 auto; padding: 0 1rem; }
        .form-wrapper { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; margin-bottom: 3rem; }
        h2.page-title { color: #1e293b; font-size: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; }
        @media (max-width: 992px) { body { margin-left: 0; padding-top: 90px; } }
        body.dark-theme { background: #0f172a; }
        body.dark-theme .form-wrapper { background: #1e293b; border-color: #334155; }
        body.dark-theme h2.page-title { color: #f8fafc; border-bottom-color: #334155; }
        .form-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; }
        body.dark-theme .form-actions { border-top-color: #334155; }
        
        /* Стили для формы */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: #374151; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-size: 0.9rem; }
        .row-select-group { display: flex; gap: 1rem; flex-wrap: wrap; }
        .row-select-group .form-group { flex: 1; }
        .category-select-group { display: flex; gap: 1rem; flex-wrap: wrap; }
        .category-select-group .form-group { flex: 1; }
        .btn-primary { background: #3b82f6; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; padding: 0.6rem 1.2rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .media-list { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
        .media-item { position: relative; width: 80px; height: 80px; border: 2px solid #e5e7eb; border-radius: 0.75rem; overflow: hidden; }
        .media-item img { width: 100%; height: 100%; object-fit: cover; }
        .media-item .media-actions { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); display: flex; justify-content: space-around; padding: 4px; }
        .media-item .media-actions button { background: none; border: none; color: white; cursor: pointer; font-size: 0.8rem; }
        .map-small { width: 100%; height: 250px; border-radius: 12px; margin-top: 0.5rem; border: 1px solid #e5e7eb; }
                    /* =========================================
           ИСПРАВЛЕНИЕ ДЛЯ ТЕМНОЙ ТЕМЫ (АДРЕС И ПОДСКАЗКИ)
           ========================================= */
        body.dark-theme #editMapSearch,
        body.dark-theme #createMapSearch {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }

        /* Главный контейнер подсказок (wildcard надежно ловит классы Яндекса) */
        body.dark-theme [class*="suggest"] {
            background-color: #1e293b !important;
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
            color: #cbd5e1 !important;
        }

        /* Убираем белый фон у всех вложенных элементов списка */
        body.dark-theme [class*="suggest"] * {
            background-color: transparent !important;
            color: #cbd5e1 !important;
        }

        /* Подсветка строки при наведении */
        body.dark-theme [class*="suggest"] [class*="item"]:hover,
        body.dark-theme [class*="suggest"] li:hover {
            background-color: #334155 !important;
            background: #334155 !important;
        }

        /* Делаем текст белым при наведении */
        body.dark-theme [class*="suggest"] [class*="item"]:hover *,
        body.dark-theme [class*="suggest"] li:hover * {
            color: #ffffff !important;
        }
    </style>

</head>
<body>
    <header id="main-header"></header>
    <div class="page-container">
        <div class="form-wrapper">
            <h2 class="page-title">➕ Новое объявление</h2>
            
            <div class="form-group"><label>Название</label><input type="text" id="listingTitleModal" placeholder="iPhone 14 Pro"></div>
            <div class="form-group"><label>Цена от (₽) *</label><input type="number" id="listingPriceModal" placeholder="Минимальная цена" required></div>
            <div class="form-group"><label>Цена до (₽) (если диапазон)</label><input type="number" id="listingPriceMaxModal" placeholder="Максимальная цена"></div>
            <div class="form-group"><label>Описание</label><textarea id="listingDescriptionModal" rows="3"></textarea></div>
            <div class="category-select-group">
                <div class="form-group"><label>Группа</label><select id="createGroup"><option value="">-- Выберите группу --</option></select></div>
                <div class="form-group" id="createSubgroupGroup" style="display: none;"><label>Подгруппа</label><select id="createSubgroup"><option value="">-- Сначала выберите группу --</option></select></div>
                <div class="form-group" id="createCategoryGroup" style="display: none;"><label>Категория</label><select id="createCategorySelect"><option value="">-- Сначала выберите подгруппу --</option></select></div>
            </div>
            <div class="form-group"><label>Тип объявления</label><select id="listingTypeModal"><option value="sell">Продам</option><option value="buy">Куплю</option></select></div>
            <div class="row-select-group">
                <div class="form-group"><label>Регион</label><select id="modalRegion"><option value="">-- Выберите регион --</option></select></div>
                <div class="form-group" id="modalCityGroup" style="display: none;"><label>Город</label><select id="modalCity"><option value="">-- Сначала выберите регион --</option></select></div>
            </div>
            <div class="form-group">
                <label>Местоположение на карте</label>
                <div id="createMap" class="map-small" style="height:200px;"></div>
                
            <div class="form-group" style="margin-top: 1rem; position: relative; z-index: 100;">
                <label>Адрес (улица, дом, квартира)</label>
                <input type="text" id="createMapSearch" placeholder="Начните вводить адрес..." autocomplete="off" style="width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-size: 0.9rem;">
                <input type="hidden" id="createLat">
                <input type="hidden" id="createLng">
            </div>
    
            </div>
            <div class="form-group"><label>Фото (до 10 шт)</label><input type="file" id="listingMediaModal" multiple accept="image/jpeg,image/jpg,image/png,image/gif,image/webp,image/heic,image/heif"></div>
            <div class="form-group">
                <label>Телефон для связи</label>
                <input type="text" id="createPhone" placeholder="+7 (999) 123-45-67">
                <small style="color:#6b7280; display:block; margin-top:4px;">Оставьте пустым, чтобы использовать контакты из профиля.</small>
            </div>
            <div class="form-group">
                <label>WhatsApp (номер)</label>
                <input type="text" id="createWhatsapp" placeholder="+7 (999) 123-45-67">
            </div>
            <div class="form-group">
                <label>Telegram (username или номер)</label>
                <input type="text" id="createTelegram" placeholder="@username или +79991234567">
            </div>
            <div class="checkbox-group" style="margin-top:0.5rem;">
                <input type="checkbox" id="createShowPhone" checked>
                <label>Показывать телефон в объявлении</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="createShowWhatsapp" checked>
                <label>Показывать WhatsApp</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="createShowTelegram" checked>
                <label>Показывать Telegram</label>
            </div>
            <div class="form-actions"><button class="btn-secondary" onclick="window.location.href='/'">Отмена</button><button class="btn-primary" id="submitCreateModalBtn">Опубликовать</button></div>
        </div>
        </div>
    </div>
    <script src="/js/common.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isEdit = false;
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (isEdit) {
                if (!id) return;
                document.getElementById('editId').value = id;
            }

            // Загрузка данных при редактировании
            let data = {};
            if (isEdit && id) {
                try {
                    const res = await fetch('/api/listings/' + id);
                    data = await res.json();
                    
                    if(document.getElementById('editTitle')) document.getElementById('editTitle').value = data.title || '';
                    if(document.getElementById('editPriceMin')) document.getElementById('editPriceMin').value = data.price || '';
                    if(document.getElementById('editPriceMax')) document.getElementById('editPriceMax').value = data.price_max || '';
                    if(document.getElementById('editDescription')) document.getElementById('editDescription').value = data.description || '';
                    if(document.getElementById('editPhone')) document.getElementById('editPhone').value = data.phone || '';
                    if(document.getElementById('editWhatsapp')) document.getElementById('editWhatsapp').value = data.whatsapp || '';
                    if(document.getElementById('editTelegram')) document.getElementById('editTelegram').value = data.telegram || '';
                    if(document.getElementById('editShowPhone')) document.getElementById('editShowPhone').checked = data.show_phone !== false;
                    if(document.getElementById('editShowWhatsapp')) document.getElementById('editShowWhatsapp').checked = data.show_whatsapp !== false;
                    if(document.getElementById('editShowTelegram')) document.getElementById('editShowTelegram').checked = data.show_telegram !== false;

                    const mediaList = document.getElementById('editMediaList');
                    if (mediaList && data.media && data.media.length > 0) {
                        mediaList.innerHTML = '';
                        data.media.forEach(m => {
                            const div = document.createElement('div');
                            div.className = 'media-item';
                            div.innerHTML = `<img src="${m.file_path}" onclick="openImagePreview('${m.file_path}')"><div class="media-actions"><button type="button" onclick="setMainPhoto(${m.id})">⭐</button><button type="button" onclick="deletePhoto(${m.id})">🗑️</button></div>`;
                            mediaList.appendChild(div);
                        });
                    }
                } catch(e) { console.error('Ошибка загрузки:', e); }
            }

            // Функция для заполнения селектов
            async function loadSelect(endpoint, selectId, placeholder, selectedId) {
                const select = document.getElementById(selectId);
                if (!select) return;
                try {
                    const res = await fetch('/api' + endpoint);
                    let items = await res.json(); if (items.value && Array.isArray(items.value)) items = items.value;
                    select.innerHTML = `<option value="">-- ${placeholder} --</option>`;
                    items.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.id;
                        opt.textContent = item.name;
                        if (selectedId == item.id) opt.selected = true;
                        select.appendChild(opt);
                    });
                } catch(e) { console.error('Ошибка ' + selectId, e); }
            }

            // Загружаем регионы и группы
            await loadSelect('/cities/regions/all', isEdit ? 'editRegion' : 'createRegion', 'Выберите регион', data.region_id);
            await loadSelect('/categories?level=1', isEdit ? 'editGroup' : 'createGroup', 'Выберите группу', data.category_id);

            // --- КАСКАДЫ ---
            const p = isEdit ? 'edit' : 'create';
            const regionSelect = document.getElementById(p + 'Region');
            if (regionSelect) {
                regionSelect.addEventListener('change', async function() {
                    const regId = this.value;
                    const citySelect = document.getElementById(p + 'City');
                    const cityGroup = document.getElementById(p + 'CityGroup');
                    if (regId) {
                        if(cityGroup) cityGroup.style.display = 'block';
                        await loadSelect('/cities?region_id=' + regId, p + 'City', 'Выберите город', data.city_id);
                    } else {
                        if(cityGroup) cityGroup.style.display = 'none';
                    }
                });
                if (data.region_id) regionSelect.dispatchEvent(new Event('change'));
            }

            // (Логика подгрупп и категорий аналогично)
            
            // --- КАРТА ---
            
            // --- КАСКАДЫ КАТЕГОРИЙ ---
            const groupSelect = document.getElementById('createGroup');
            const subgroupSelect = document.getElementById('createSubgroup');
            const categorySelect = document.getElementById('createCategorySelect');
            
            if (groupSelect) {
                groupSelect.addEventListener('change', async function() {
                    const gId = this.value;
                    if (!gId) return;
                    document.getElementById('createSubgroupGroup').style.display = 'block';
                    subgroupSelect.innerHTML = '<option value="">Загрузка...</option>';
                    try {
                        const res = await fetch('/api/categories?parent_id=' + gId);
                        const subData = await res.json(); const subgroups = subData.value || subData;
                        subgroupSelect.innerHTML = '<option value="">-- Выберите подгруппу --</option>';
                        subgroups.forEach(s => subgroupSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`);
                    } catch(e) { console.error(e); }
                });
            }

            if (subgroupSelect) {
                subgroupSelect.addEventListener('change', async function() {
                    const sId = this.value;
                    if (!sId) return;
                    document.getElementById('createCategoryGroup').style.display = 'block';
                    categorySelect.innerHTML = '<option value="">Загрузка...</option>';
                    try {
                        const res = await fetch('/api/categories?parent_id=' + sId);
                        const catData = await res.json(); const cats = catData.value || catData;
                        categorySelect.innerHTML = '<option value="">-- Выберите категорию --</option>';
                        cats.forEach(c => categorySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);
                    } catch(e) { console.error(e); }
                });
            }
    
            const checkYmaps = setInterval(() => {
                if (typeof ymaps !== 'undefined') {
                    clearInterval(checkYmaps);
                    ymaps.ready(() => {
                        const mapId = isEdit ? 'editMap' : 'createMap';
                        const latId = isEdit ? 'editLat' : 'createLat';
                        const lngId = isEdit ? 'editLng' : 'createLng';
                        const inputId = isEdit ? 'editMapSearch' : 'createMapSearch';

                        const mapEl = document.getElementById(mapId);
                        if (!mapEl) return;

                        const map = new ymaps.Map(mapId, { center: [55.75, 37.62], zoom: 10, controls: ['zoomControl'] });
                        
                        if (data.lat && data.lng) {
                            map.setCenter([data.lat, data.lng], 16);
                            map.geoObjects.add(new ymaps.Placemark([data.lat, data.lng]));
                            document.getElementById(latId).value = data.lat;
                            document.getElementById(lngId).value = data.lng;
                        }
                        
                        const searchInput = document.getElementById(inputId);
                        if (searchInput) {
                            if (data.address) searchInput.value = data.address;
                            const suggestView = new ymaps.SuggestView(inputId, { provider: 'yandex#map', results: 10 });
                            suggestView.events.add('select', function (e) {
                                const item = e.get('item');
                                searchInput.value = item.displayName;
                                ymaps.geocode(item.value).then(res => {
                                    const firstGeoObject = res.geoObjects.get(0);
                                    if (firstGeoObject) {
                                        const coords = firstGeoObject.geometry.getCoordinates();
                                        map.setCenter(coords, 16);
                                        map.geoObjects.removeAll();
                                        map.geoObjects.add(new ymaps.Placemark(coords));
                                        document.getElementById(latId).value = coords[0];
                                        document.getElementById(lngId).value = coords[1];
                                    }
                                });
                            });
                        }

                        map.events.add('click', (e) => {
                            const coords = e.get('coords');
                            map.geoObjects.removeAll();
                            map.geoObjects.add(new ymaps.Placemark(coords));
                            document.getElementById(latId).value = coords[0];
                            document.getElementById(lngId).value = coords[1];

                            ymaps.geocode(coords).then(res => {
                                const firstGeoObject = res.geoObjects.get(0);
                                if (firstGeoObject && searchInput) searchInput.value = firstGeoObject.getAddressLine();
                            });
                        });
                        setTimeout(() => map.container.fitToViewport(), 100);
                    });
                }
            }, 100);

            // --- СОХРАНЕНИЕ ---
            const saveBtnId = isEdit ? 'saveEditBtn' : 'submitCreateModalBtn';
            const saveBtn = document.getElementById(saveBtnId) || document.querySelector('.btn-primary:last-child');
            
            if (saveBtn) {
                saveBtn.onclick = async (e) => {
                    e.preventDefault();
                    saveBtn.disabled = true;
                    saveBtn.textContent = 'Сохранение...';
                    
                    const token = localStorage.getItem('token');
                    const payload = {
                        title: document.getElementById(p + 'Title').value,
                        price: document.getElementById(p + 'PriceMin') ? document.getElementById(p + 'PriceMin').value : 0,
                        price_max: document.getElementById(p + 'PriceMax') ? document.getElementById(p + 'PriceMax').value : null,
                        description: document.getElementById(p + 'Description').value,
                        category_id: document.getElementById(p + 'CategorySelect') ? document.getElementById(p + 'CategorySelect').value : null,
                        type: document.getElementById(p + 'Type').value,
                        city_id: document.getElementById(p + 'City') ? document.getElementById(p + 'City').value : null,
                        region_id: document.getElementById(p + 'Region').value,
                        address: document.getElementById(p + 'MapSearch').value,
                        lat: document.getElementById(p + 'Lat').value,
                        lng: document.getElementById(p + 'Lng').value,
                        phone: document.getElementById(p + 'Phone') ? document.getElementById(p + 'Phone').value : '',
                        whatsapp: document.getElementById(p + 'Whatsapp') ? document.getElementById(p + 'Whatsapp').value : '',
                        telegram: document.getElementById(p + 'Telegram') ? document.getElementById(p + 'Telegram').value : '',
                        show_phone: document.getElementById(p + 'ShowPhone') ? document.getElementById(p + 'ShowPhone').checked : true,
                        show_whatsapp: document.getElementById(p + 'ShowWhatsapp') ? document.getElementById(p + 'ShowWhatsapp').checked : true,
                        show_telegram: document.getElementById(p + 'ShowTelegram') ? document.getElementById(p + 'ShowTelegram').checked : true
                    };

                    const url = isEdit ? '/api/listings/' + id : '/api/listings';
                    const method = isEdit ? 'PUT' : 'POST';

                    try {
                        const res = await fetch(url, {
                            method: method,
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            alert('✅ Успешно сохранено!');
                            window.location.href = '/profile.html';
                        } else {
                            alert('❌ Ошибка сохранения');
                            saveBtn.disabled = false;
                            saveBtn.textContent = 'Сохранить';
                        }
                    } catch (err) {
                        alert('❌ Ошибка сети');
                        saveBtn.disabled = false;
                        saveBtn.textContent = 'Сохранить';
                    }
                };
            }
        });
    </script>
</body>
</html>
